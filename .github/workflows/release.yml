name: Release

# Pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) builds, tests and packages
# Kiebitz, and puts the .dmg on a new GitHub release as a draft: it is published by hand on
# GitHub, after a look at its notes. A tag with a suffix (v1.1.0-beta) or below 1.0 makes a
# pre-release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  release:
    name: Build and package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version
        run: |
          version="$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag%%-*}" != "$version" ]]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the version in CMakeLists.txt ($version)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: brew install ninja qt

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Package (self-contained app + DMG)
        run: bash scripts/package_macos.sh --no-build build/ci

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* || "$VERSION" == 0.* ]]; then
            prerelease=(--prerelease)
          fi
          minos="$(otool -l build/ci/package/Kiebitz.app/Contents/MacOS/Kiebitz \
            | awk '/LC_BUILD_VERSION/ {found=1} found && /minos/ {print $2; exit}')"
          {
            echo "## Download"
            echo
            echo "**Kiebitz-$VERSION.dmg**: open it and drag Kiebitz to Applications."
            echo "Needs macOS $minos or newer on an Apple silicon Mac."
            echo
            echo "Kiebitz isn't signed with an Apple Developer ID yet: the first time, macOS"
            echo "refuses to open it. Open **System Settings → Privacy & Security** and click"
            echo "**Open Anyway** next to Kiebitz."
            echo
            echo "## What's new"
            echo
          } > notes.md
          gh release create "$GITHUB_REF_NAME" build/ci/package/*.dmg \
            --draft "${prerelease[@]}" --title "Kiebitz $VERSION" \
            --notes-file notes.md --generate-notes
